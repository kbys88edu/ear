<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chord Practice | コードの聞き分け</title>
  <link rel="stylesheet" href="style.css?v=20260629-no-brand" />
  <link rel="stylesheet" href="../nav.css?v=20260629-nav-clean" />
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <div class="top-item">
        <span class="label">CHORD</span>
      </div>
      <div class="top-copy">
        <span>Ear training for triads, seventh chords, and extended colors</span>
        <span>Block / Arpeggio up / Arpeggio down</span>
      </div>
      <div class="top-count"><span id="progress-count">00 / 00</span>
      </div>
    </header>

    <section class="workbench chord-workbench">
      <aside class="panel config-panel">
        <div class="panel-title">SETTINGS</div>

        <div class="field">
          <div class="field-label">MODE</div>
          <div class="mode-stack">
            <label><input type="radio" name="mode" value="block" checked> Harmonic</label>
            <label><input type="radio" name="mode" value="arpUp"> 上行分散</label>
            <label><input type="radio" name="mode" value="arpDown"> 下行分散</label>
          </div>
        </div>

        <div class="field">
          <div class="field-label">INVERSION</div>
          <div id="inversion-options" class="inversion-grid">
            <label><input type="checkbox" value="0" checked> Root</label>
            <label><input type="checkbox" value="1" checked> 1st</label>
            <label><input type="checkbox" value="2" checked> 2nd</label>
            <label><input type="checkbox" value="3"> 3rd</label>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="instrument-select">SOUND</label>
          <select id="instrument-select">
            <option value="realPiano">Real piano</option>
            <option value="softPiano">Soft piano</option>
            <option value="clearSine">Sine</option>
            <option value="warmSynth">Warm synth</option>
            <option value="organ">Organ</option>
            <option value="pluck">Pluck</option>
          </select>
        </div>

        <div class="field">
          <div class="field-label">PRESET</div>
          <div class="preset-row">
            <button class="mini" data-preset="triads" type="button">三和音</button>
            <button class="mini" data-preset="sevenths" type="button">七和音</button>
            <button class="mini" data-preset="advanced" type="button">応用</button>
          </div>
        </div>

        <div class="field chord-range-field">
          <div class="panel-title row-title">
            <span>CHORD TYPES</span>
            <span class="range-tools">
              <button id="select-all-chords" class="micro" type="button">ALL</button>
              <button id="clear-all-chords" class="micro" type="button">NONE</button>
            </span>
          </div>
          <div id="chord-options" class="choice-grid chord-type-grid"></div>
        </div>
      </aside>

      <section class="panel main-panel">
        <div class="display-card">
          <div class="display-label">CURRENT QUESTION</div>
          <div id="question-display" class="question-display">LISTEN</div>
          <div id="status" class="status" aria-live="polite">
            NEW を押して、演奏された和音を3つの選択肢から選んでください。
          </div>
        </div>

        <div class="button-row">
          <button id="new-question" type="button">NEW</button>
          <button id="play-question" type="button">PLAY</button>
          <button id="show-answer" type="button">SHOW</button>
          <button id="export-pdf" type="button">PDF</button>
        </div>

        <div id="answer-text" class="answer-text answer-summary"></div>

        <div class="score-strip">
          <div><span>QUESTIONS</span><strong id="total-count">0</strong></div>
          <div><span>CORRECT</span><strong id="correct-count">0</strong></div>
          <div><span>RATE</span><strong id="score-percent">0%</strong></div>
          <div><span>TIME</span><strong id="current-time">--</strong></div>
          <button id="reset-score" type="button" class="mini">RESET</button>
        </div>

        <div class="notation-card">
          <div class="panel-title">NOTATION</div>
          <div id="notation" class="notation"></div>
        </div>
      </section>

      <aside class="panel answer-panel">
        <div class="panel-title">ANSWER</div>
        <div id="answer-buttons" class="answer-grid"></div>
      </aside>
    </section>

    <section class="bottom-area">
      <div class="history-card">
        <div class="panel-title">RESULT LOG</div>
        <div id="history-list" class="history-list">まだ解答履歴がありません。</div>
      </div>
    </section>
  </main>

  <script src="app.js?v=20260629-nobeep-preset"></script>
  <script src="../lang.js?v=20260629-preset"></script>
</body>
</html>
